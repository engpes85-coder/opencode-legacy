name: win7-desktop

on:
  workflow_dispatch:
    inputs:
      electron_url:
        description: electron-legacy win32-x64 zip
        default: https://github.com/Alex313031/electron-legacy/releases/download/v44.2.0/electron-v44.2.0-win32-x64.zip
      electron_version:
        description: version inside that zip
        default: "44.2.0"
      server_only:
        description: only build and test the server bundle (fast)
        type: boolean
        default: false
      app_version:
        description: version string for the app and server bundle
        default: "2.3.0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OPENCODE_VERSION: ${{ inputs.app_version }}
      OPENCODE_CHANNEL: dev
      OPENCODE_TARGET: windows-x64
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Use the tested commit and apply Windows 7/8 patch
        shell: bash
        run: |
          cp opencode-win7.patch "$RUNNER_TEMP/win7.patch"
          if git fetch --depth=1 origin 375f654e6dc62a3224ca3663fa335d8b57584797; then
            git checkout --force FETCH_HEAD
          else
            echo "Tested commit not available; using the branch tip"
          fi
          git apply --whitespace=nowarn "$RUNNER_TEMP/win7.patch"

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build server bundle
        shell: bash
        working-directory: packages/cli
        run: bun run build:node --bundle-only

      - name: Stage server bundle
        shell: bash
        run: |
          mkdir -p packages/desktop/resources/win7/server
          cp packages/cli/dist-node/opencode.mjs packages/desktop/resources/win7/server/
          cp -r packages/cli/dist-node/assets packages/desktop/resources/win7/server/
          printf '%s' "$OPENCODE_VERSION" > packages/desktop/resources/opencode-cli.version
          ls -la packages/desktop/resources/win7/server

      - name: Make server bundle load on Node 22
        shell: bash
        run: |
          cat > fix-bundle.cjs <<'EOF'
          const fs = require("fs")
          const p = "packages/desktop/resources/win7/server/opencode.mjs"
          let s = fs.readFileSync(p, "utf8")
          const a = "getAssetKeys as __ocAssetKeys,"
          const b = "const __filename=import.meta.filename,"
          if (!s.includes(a) || !s.includes(b)) throw new Error("bundle prelude not found")
          s = s.replace(a, "").replace(b, "const __ocAssetKeys=()=>[];" + b)
          fs.writeFileSync(p, s)
          console.log("patched node:sea import")
          EOF
          node fix-bundle.cjs

      - name: Smoke test server bundle on Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Run server bundle with Node 22
        shell: bash
        continue-on-error: true
        run: |
          node packages/desktop/resources/win7/server/opencode.mjs --version
          node packages/desktop/resources/win7/server/opencode.mjs --help | head -20

      - name: Download legacy Electron
        if: ${{ !inputs.server_only }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ inputs.electron_url }}" -OutFile electron.zip
          Expand-Archive electron.zip -DestinationPath electron-dist
          Get-ChildItem electron-dist | Select-Object -First 20

      - name: Build desktop app
        if: ${{ !inputs.server_only }}
        shell: bash
        working-directory: packages/desktop
        env:
          OPENCODE_WIN7: "1"
          OPENCODE_ELECTRON_DIST: ${{ github.workspace }}/electron-dist
          OPENCODE_ELECTRON_VERSION: ${{ inputs.electron_version }}
        run: |
          bun ./script/copy-icons.ts dev
          bunx electron-vite build
          bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts

      - name: Upload portable folder
        if: ${{ !inputs.server_only }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-win7-portable
          path: packages/desktop/dist/win-unpacked
          retention-days: 7

      - name: Upload installer
        if: ${{ !inputs.server_only }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-win7-installer
          path: packages/desktop/dist/*.exe
          retention-days: 7
